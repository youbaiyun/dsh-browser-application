name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Everything here must pass. A red result on this job means the branch is not
  # mergeable, so it deliberately contains only checks that are green on a clean
  # checkout of every supported platform.
  required:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run check:runtime
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # The build must actually contain what the loaders read. `check:build`
      # catches the case this repository has been bitten by: source edited,
      # artifact not rebuilt, app silently running the old code.
      - run: pnpm run check:build

  # Informational on purpose. This one exercises a real DSH host end to end and
  # currently fails at the session-disposal assertion on DSH 0.2.0-rc.2 — the
  # same way in this fork and in upstream, in code this fork does not own. It is
  # reported rather than hidden, and it does not block a merge. See the "Known
  # issues" section of CHANGELOG.md.
  smoke:
    name: Smoke (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - name: Install into a fresh store
        run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/dsh-pnpm-store"
      - run: pnpm run build
      - run: pnpm run test:smoke
